# dsh-app-launcher bundle patch — 只插入本插件一行。
#
# 这里的 config 是**出厂种子**：插件首次启动时把它落成用户层
# $DSH_HOME/app-launcher/config.json，之后界面里的增删改都写用户层，
# 不再回写本文件（升级插件不会覆盖你的修改）。
# 想恢复出厂配置：设置页点「恢复默认配置」。
#
# 宿主半边：包 main（lib/index.js）—— 注册 5 个 tool（常驻 app_toggle +
#          按全局 enabled 动态挂载的 4 个 app_*）+ 设置页接口。
# 浏览器半边：包内 `dsh.client` 声明会让 web 端加载 exports["./client"]。
- insert:
    - id: dsh-app-launcher
      name: dsh-app-launcher
      config:
        enabled: true
        # 免二次授权的边界：只有 programs 里 enabled=true 且路径写死在配置里的条目能被启动。
        verbose: true
        dryRun: false
        # 采样缓存：3 秒内重复查询复用同一份读数，避免 Agent 连续调用时刷爆 nvidia-smi。
        sampleCacheMs: 3000
        # 读不到 GPU 时的策略：reject 放弃启动 / allow 仍然启动。
        unreadableGpuPolicy: reject
        # 同族互斥：一次只允许一个 GPU 重活运行；冲突时只拒绝并给建议，绝不杀别人的进程。
        conflictPolicy: reject
        # 全局授权目录（可选兜底，所有程序共享）。
        # 正常应在每个程序自己的 allowedDirs 里配（跟着软件走），这里留空即可。
        allowedDirs: []
        programs:
          # ComfyUI Desktop：可以正常启动。
          #
          # 曾经的错误归因（已推翻）：之前观察到它从后台启动会在 3 秒内静默退出，
          # 曾误判成"Electron 只能从桌面启动"。真因是**环境变量**
          # `ELECTRON_RUN_AS_NODE=1` —— DSH 宿主自己是用 Electron 打包的，
          # 启动时把它注入进程环境，子进程继承后任何 Electron 应用都会以
          # 纯 Node 模式运行（不建窗口、跑完即退）。
          # 插件现在在 spawn 前剔除该变量，实测可正常拉起（后端 ~10s 就绪）。
          - id: comfyui
            name: ComfyUI
            enabled: true
            description: 图像/视频生成底座（Qwen-Image / WAN / MiniMax H3）。启动后监听 8188，冷启动约 1–2 分钟。
            launch:
              exe: 'C:\Users\wjm\AppData\Local\Programs\ComfyUI\Comfy Desktop\Comfy Desktop.exe'
              args: []
              cwd: 'C:\Users\wjm\AppData\Local\Programs\ComfyUI\Comfy Desktop'
              env: {}
            # 这个程序自己的数据目录：模型库与输出/输入/用户目录
            allowedDirs:
              - 'F:\program\ComfyUI\models'
              - 'F:\program\ComfyUI\input'
              - 'F:\program\ComfyUI\output'
              - 'F:\program\ComfyUI\user'
              - 'H:\apps\ComfyUI\models'
            needs:
              gpuUtilPctMax: 10
              freeVramMiBMin: 6000
              freeRamMiBMin: 4096
              cpuPctMax: 80
            exclusive: gpu-heavy
            ready:
              url: 'http://127.0.0.1:8188/system_stats'
              # 冷启动实测约 75–120 秒（33 个自定义节点），给足余量
              timeoutMs: 240000
              intervalMs: 2000
            stopTimeoutMs: 30000

          - id: lm-studio
            name: LM Studio
            enabled: true
            description: 本地 LLM 推理服务（OpenAI 兼容 http://127.0.0.1:1234/v1）
            launch:
              exe: 'F:\program\LM Studio\resources\app\.webpack\lms.exe'
              args: ['server', 'start']
              cwd: 'F:\program\LM Studio\resources\app\.webpack'
              env: {}
            allowedDirs:
              - 'F:\program\LM Studio'
              - 'C:\Users\wjm\.lmstudio'
            needs:
              gpuUtilPctMax: 10
              freeVramMiBMin: 12000
              freeRamMiBMin: 8192
              cpuPctMax: 80
            exclusive: gpu-heavy
            ready:
              url: 'http://127.0.0.1:1234/v1/models'
              timeoutMs: 120000
              intervalMs: 1000
            stopTimeoutMs: 20000

          - id: ninfer
            name: NInfer 引擎
            enabled: true
            description: 本地 LLM 推理引擎（OpenAI 兼容 http://127.0.0.1:8094/v1）
            launch:
              exe: 'H:\apps\infer-engine-sm120a-20261002\engine\ninfer-serve-120a.exe'
              args: [
                'H:\apps\infer-engine-sm120a-20261002\models\Ternary-Bonsai-2-27B-ninfer-v3.ninfer',
                '--host', '127.0.0.1',
                '--port', '8094',
                '--model-id', 'qwen3.8-27b',
                '--max-context', '262144',
                '--kv-capacity', '32768',
                '--kv-dtype', 'k8v4',
                '--host-kv-mib', '16384',
                '--prefill-chunk', '1024',
                '--spec', 'dflash2',
                '--draft-tokens', '12',
                '--lm-head-draft',
                '--vision',
                '--default-max-tokens', '32768',
                '--default-reasoning-effort', 'none',
                '--max-concurrency', '1',
                '--max-shared-prefixes', '0',
                '--presence-penalty', '0',
                '--temperature', '0.7',
                '--top-p', '0.9',
                '--top-k', '20'
              ]
              cwd: 'H:\apps\infer-engine-sm120a-20261002\engine'
              env:
                NINFER_KV_WINDOW: '16384'
                NINFER_KV_RETRIEVE: '8192'
                NINFER_KV_RING: '1'
                NINFER_HOST_PAGEABLE: '1'
                NINFER_KV_REUSE_HOSTBACKED: '1'
            allowedDirs:
              - 'H:\apps\infer-engine-sm120a-20261002'
            needs:
              gpuUtilPctMax: 10
              freeVramMiBMin: 12000
              freeRamMiBMin: 8192
              cpuPctMax: 80
            exclusive: gpu-heavy
            ready:
              url: 'http://127.0.0.1:8094/v1/models'
              timeoutMs: 180000
              intervalMs: 1000
            stopTimeoutMs: 20000

          # Blender：纯 GUI 程序，**不监听任何端口**，所以不配 ready.url。
          # 在线判定走"按进程名 blender 找 pid"（见 lib/programs.mjs 的 pidsByProcessName）。
          # exclusive 留空：它不占用互斥组，避免和 LM Studio/ComfyUI 互相卡死。
          - id: blender
            name: Blender
            enabled: true
            description: 3D 建模 / 渲染（Steam 安装的 Blender 5.2）。GPU 渲染会吃满显存，启动前请确认没有别的重活在跑。
            launch:
              exe: 'E:\SteamLibrary\steamapps\common\Blender\blender.exe'
              args: []
              cwd: 'E:\SteamLibrary\steamapps\common\Blender'
              env: {}
            allowedDirs:
              - 'E:\SteamLibrary\steamapps\common\Blender'
            needs:
              # 只有对显存/内存有要求：Blender 起来后才会吃 GPU，启动瞬间利用率通常不高，
              # 所以不卡 gpuUtilPctMax（否则刚空转时会误拒）。
              freeVramMiBMin: 4096
              freeRamMiBMin: 8192
            exclusive: ''
            ready:
              # 故意留空：Blender 没有 HTTP 健康检查端口。
              url: ''
              timeoutMs: 60000
              intervalMs: 1000
            stopTimeoutMs: 20000
